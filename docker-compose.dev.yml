# Geliştirme için override — docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: development
      USALP_PUBLIC_URL: http://localhost
      CORS_ORIGINS: http://localhost,http://localhost:3000
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-admin}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:-}
    volumes:
      - ./backend:/app

  dashboard:
    command: npm run dev
    volumes:
      - ./dashboard:/app
      - /app/node_modules      # node_modules host'tan izole
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: /api/v1

  caddy:
    environment:
      USALP_SITE_ADDRESS: :80

  postgres:
    ports:
      - "5432:5432"            # Dev'de dışarıdan erişim (DBeaver vb.)
