services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: usalp
      POSTGRES_USER: usalp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usalp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://usalp:${POSTGRES_PASSWORD}@postgres:5432/usalp
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-sonnet-4}
      SECRET_KEY: ${SECRET_KEY}
      USALP_PUBLIC_URL: ${USALP_PUBLIC_URL:-https://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_SEED_RESET: ${DEMO_SEED_RESET:-true}
      ALERT_NOTIFICATIONS_ENABLED: ${ALERT_NOTIFICATIONS_ENABLED:-true}
      ALERT_NOTIFICATION_TIMEOUT_SECONDS: ${ALERT_NOTIFICATION_TIMEOUT_SECONDS:-5}
      ALERT_EMAIL_HOST: ${ALERT_EMAIL_HOST:-}
      ALERT_EMAIL_PORT: ${ALERT_EMAIL_PORT:-587}
      ALERT_EMAIL_USERNAME: ${ALERT_EMAIL_USERNAME:-}
      ALERT_EMAIL_PASSWORD: ${ALERT_EMAIL_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_USE_SSL: ${ALERT_EMAIL_USE_SSL:-false}
      ALERT_EMAIL_STARTTLS: ${ALERT_EMAIL_STARTTLS:-true}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - ./agent:/agent:ro

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    depends_on:
      - backend
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      USALP_SITE_ADDRESS: ${USALP_SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.invalid}
      MAX_REQUEST_BODY_SIZE: ${MAX_REQUEST_BODY_SIZE:-10MB}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - dashboard
    networks:
      - internal
      - external

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
