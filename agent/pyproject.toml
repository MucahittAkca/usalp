[project]
name = "usalp-agent"
version = "0.1.0"
description = "Usalp sunucu izleme ajanı — metrik, servis ve log toplayıcı"
requires-python = ">=3.12"
dependencies = [
    "psutil>=6.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
    "tenacity>=9.0.0",
    "schedule>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
usalp-agent = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "models"]

[tool.setuptools.packages.find]
include = ["collectors*", "readers*", "sender*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
