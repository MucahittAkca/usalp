server_id: web-server-01
backend_url: http://localhost:8000
api_key: usalp-agent-change-me

intervals:
  fast: 30
  slow: 60

services:
  - nginx
  - docker
  - postgresql
  - redis

log_files:
  - path: /var/log/nginx/error.log
    tail_lines: 100
    min_level: ERROR
  - path: /var/log/syslog
    tail_lines: 50
    min_level: WARNING
