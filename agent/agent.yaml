server_id: web-server-01
backend_url: https://monitoring.example.com
api_key: usalp-agent-change-me

intervals:
  fast: 30
  slow: 60

queue:
  dir: /var/lib/usalp-agent/queue
  max_items: 1000
  flush_batch_size: 25

services:
  - nginx
  - docker
  - postgresql
  - redis

log_files:
  - path: /var/log/nginx/error.log
    tail_lines: 100
    min_level: ERROR
  - path: /var/log/syslog
    tail_lines: 50
    min_level: WARNING
